<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign-up form</title>
    <link rel="stylesheet" href="style.css">

</head>
<body>

    <div id="logo-container">
        <div id="logo">
            <img src="images/odin-lined.png" width="100" height="100">
            <h1>ODIN</h1>
        </div>
        <div id="photo-credit">
            Photo by <a href="https://unsplash.com/@haliewestphoto">Halie West</a> on <a href="https://unsplash.com/">Unsplash</a>
        </div>
    </div>

    <div id="form-container">

        <div id="form-header">
            <p>
                This is not a real online service! You know you need something like this in your life to help you realize your
                deepest dreams. Sign up <em>now</em> to get started.
            </p>
            <p>
                You <em>know</em> you want to.
            </p>
        </div>

        <form action="#" method="get">
            <div id="form-fields">
                <h3>Let's do this!</h3>
                <div class="input-row"> 
                    <div class="input-field">
                        <label for="first-name">First name</label>
                        <input type="text" id="first-name" name="first-name">
                    </div>
                    <div class="input-field">
                        <label for="last-name">Last name</label>
                        <input type="text" id="last-name" name="last-name">
                    </div>
                </div>
                <div class="input-row">
                    <div class="input-field">
                        <label for="email-address">Email</label>
                        <input type="email" id="email-address" name="email-address">
                    </div>
                    <div class="input-field">
                        <label for="phone-number">Phone Number</label>
                        <input pattern="
                        ^(?:(?:\(?(?:00|\+)([1-4]\d\d|[1-9]\d?)\)?)?[\-\.\ \\\/]?)?((?:\(?\d{1,}\)?[\-\.\ 
                        \\\/]?){0,})(?:[\-\.\ \\\/]?(?:#|ext\.?|extension|x)[\-\.\ \\\/]?(\d+))?$" 
                        id="phone-number" name="phone-number">
                    </div>
                </div>
                <div class="input-row">
                    <div class="input-field">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password">
                    </div>
                    <div class="input-field">
                        <label for="password-confirm">Confirm Password</label>
                        <input type="password" id="password-confirm" name="password-confirm">      
                    </div>
                </div>

            </div>

            <div id="form-buttons">
                <button type="submit">Create Account</button>
                <p>
                    Already have an account? <a href="">Log in</a>
                </p>
            </div>

        </form>

    </div>

</body>
</html>
